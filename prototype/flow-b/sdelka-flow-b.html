<title>Сделка.рф · Флоу Б</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Библиотека «Мягко» — только светлая тема (у токенов один режим Light). */
/* Layout: шапка 72 → LineTabs → карточка «Параметры сделки» с чипами → список банков → нижняя панель. Контент 1200. */
:root{
  --color-action-primary:#0c2ad0; --color-action-hover:#0a22aa; --color-on-primary:#ffffff;
  --color-surface-page:#f8fafe; --color-surface-white:#ffffff; --color-surface-card:#eef6fe;
  --color-border-default:#e0e0e0; --color-border-blue:#c3d3f7; --color-chart-track:#c3d3f7; --color-chart-track-soft:#d6e4f5;
  --color-text-primary:#1a1a1a; --color-text-secondary:rgba(26,26,26,.65); --color-text-muted:rgba(26,26,26,.55); --color-text-disabled:rgba(26,26,26,.42);
  --color-error:#c34455; --color-error-bg:#fcedf0;
  --color-success:#26795d; --color-success-bg:#ecf6f1; --color-warning-text:#946319; --color-warning-bg:#fcf5e7;
  --color-primary-disabled:#d6e4f5;
  --color-surface-hover-soft:#dce9fc; --color-chart-light:#a9bcf5; --color-chart-medium:#4e68de;
  --color-rating-low:#e8a0aa; --color-rating-mid:#f0d39a; --color-rating-high:#9fd3bd; --color-rating-top:#7f97ea;
  --shadow-footer:0 -6px 20px rgba(16,36,94,.08);
  --overlay:rgba(12,42,208,.32); --shadow-pop:0 16px 40px rgba(13,26,77,.16);
  --space-3:3px;--space-4:4px;--space-6:6px;--space-8:8px;--space-10:10px;--space-12:12px;--space-14:14px;--space-16:16px;--space-20:20px;--space-24:24px;--space-32:32px;
  --radius-6:6px;--radius-10:10px;--radius-12:12px;--radius-14:14px;--radius-16:16px;--radius-20:20px;--radius-28:28px;--radius-999:999px;
  color-scheme:light;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}

*{box-sizing:border-box}
body{background:var(--color-surface-page);color:var(--color-text-primary);font-family:var(--font);font-size:14px;line-height:22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-action-primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.header{background:var(--color-surface-white);border-bottom:1px solid var(--color-border-default)}
.wrap{max-width:1232px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.header .wrap{height:72px;display:flex;align-items:center;gap:var(--space-16)}
.logo{font-size:22px;font-weight:600;color:var(--color-action-primary);letter-spacing:-.02em}
.vdiv{width:1px;height:22px;background:var(--color-border-default)}
.org{margin-left:auto;display:flex;align-items:center;gap:var(--space-16)}
.org-name{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--color-text-secondary)}
.org-name b{color:var(--color-action-primary);font-size:13px}
.avatar{width:36px;height:36px;border-radius:var(--radius-999);background:var(--color-surface-card);color:var(--color-action-primary);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.icon-btn{color:var(--color-action-primary);display:grid;place-items:center}
@media (max-width:640px){.org-name,.section-name,.vdiv{display:none}}

/* Line tabs */
.linetabs{display:flex;gap:0;margin:var(--space-24) 0 0 43px;max-width:997px;background:transparent;box-shadow:inset 0 -1px 0 var(--color-border-default);overflow-x:auto}
@media (max-width:720px){.linetabs{margin-left:0}}
.linetabs button{height:48px;padding:0 16px;font-size:14px;line-height:20px;font-weight:400;color:var(--color-text-primary);border-bottom:2px solid transparent;white-space:nowrap;background:transparent}
.linetabs button.on{color:var(--color-action-primary);border-bottom-color:var(--color-action-primary);font-weight:600}

main{padding-block:var(--space-24) var(--space-24)}
.card{background:var(--color-surface-white);border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-24)}
.row{display:flex;align-items:center;gap:var(--space-12);flex-wrap:wrap}
h2{font-size:18px;line-height:26px;font-weight:600;margin:0;text-wrap:balance}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-999);background:var(--color-chart-track-soft);color:var(--color-text-secondary);font-size:12px;font-weight:500}
.badge.success{background:var(--color-success-bg);color:var(--color-success)}
.badge.accent{background:var(--color-surface-card);color:var(--color-action-primary)}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* Filter chips */
.chips{display:flex;flex-wrap:wrap;gap:var(--space-8);margin-top:var(--space-16)}
.anchor{position:relative}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:var(--radius-12);border:1px solid var(--color-border-default);background:var(--color-surface-white);font-size:13px;white-space:nowrap}
.chip .l{color:var(--color-text-secondary)}
.chip .v{font-weight:600}
.chip.active{background:var(--color-surface-card);border-color:var(--color-border-blue)}
.chip.active .v,.chip.active svg{color:var(--color-action-primary)}
.chip.open{border-color:var(--color-action-primary)}
.chip svg{transition:transform .15s}
.chip.open svg{transform:rotate(180deg)}
.ghost-link{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:var(--radius-14);color:var(--color-text-muted);font-weight:600;font-size:13px}
.ghost-link:hover,.ghost-link.open{background:var(--color-surface-card);color:var(--color-action-primary)}

/* Popover */
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--color-surface-white);border:1px solid var(--color-border-default);border-radius:var(--radius-16);box-shadow:var(--shadow-pop);padding:var(--space-8);min-width:300px;max-width:calc(100vw - 32px)}
.pop.form{padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);width:360px}
.pop-right>.pop{left:auto;right:0}
.pop h4{margin:0;font-size:14px;font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:9px 12px;border-radius:var(--radius-10);font-size:14px}
.mi:hover{background:var(--color-surface-page)}
.mi.sel{background:var(--color-surface-card);color:var(--color-action-primary);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.seg button{height:36px;border-radius:var(--radius-10);border:1px solid var(--color-border-default);background:var(--color-surface-white)}
.seg button.on{background:var(--color-surface-card);border:1.5px solid var(--color-action-primary);color:var(--color-action-primary);font-weight:600}
.hint{font-size:12px;color:var(--color-text-secondary);line-height:1.45;margin:0}
.inset{background:var(--color-surface-card);border-radius:var(--radius-16);padding:var(--space-12);display:flex;flex-direction:column;gap:var(--space-12)}

/* Field */
.field{position:relative;display:block;border:1px solid var(--color-border-default);background:var(--color-surface-white);border-radius:var(--radius-14);padding:8px 14px;min-height:56px;text-align:left;width:100%}
.field:focus-within{border-color:var(--color-action-primary)}
.field .lab{display:block;font-size:12px;line-height:18px;color:var(--color-text-muted)}
.field input{border:0;outline:0;background:none;width:100%;font-size:16px;padding:2px 0 0}
.field .val{display:block;font-size:16px;padding-top:2px}
.field .suffix{position:absolute;right:14px;bottom:10px;color:var(--color-text-secondary)}
.field.select{cursor:pointer;padding-right:40px}
.field.select svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--color-text-secondary)}
.pair{display:grid;grid-template-columns:1fr 110px;gap:8px}
input[type=range]{width:100%;accent-color:var(--color-action-primary)}
.range-l{display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-muted)}

/* Switch / checkbox */
.switch{display:flex;align-items:center;gap:10px;text-align:left;font-size:14px}
.switch .t{width:40px;height:24px;border-radius:999px;background:var(--color-chart-track-soft);position:relative;flex:none;transition:background .15s}
.switch .t::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--color-surface-white);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch.on .t{background:var(--color-action-primary)}
.switch.on .t::after{left:19px}
.cb{width:20px;height:20px;border-radius:var(--radius-6);border:1.5px solid var(--color-border-default);display:grid;place-items:center;flex:none;background:var(--color-surface-white)}
.cb.on{background:var(--color-action-primary);border-color:var(--color-action-primary);color:var(--color-on-primary)}

/* Buttons */
.btn{height:44px;padding:0 20px;border-radius:var(--radius-14);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--color-action-primary);color:var(--color-on-primary)}
.btn.primary:hover{background:var(--color-action-hover)}
.btn.primary:disabled{background:var(--color-primary-disabled);color:var(--color-text-disabled);cursor:not-allowed}
.btn.outline{background:var(--color-surface-white);border:1px solid var(--color-border-default);color:var(--color-action-primary)}
.btn.outline:hover{background:var(--color-surface-card)}
.btn.outline:disabled{color:var(--color-text-disabled);cursor:not-allowed}
.btn.s{height:36px;padding:0 14px;font-size:13px;border-radius:var(--radius-10)}
.btn.full{width:100%}

/* Offers */
.offers-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-12);flex-wrap:wrap;margin-top:var(--space-24)}
.ftabs{display:flex;gap:4px}
.ftabs button{height:28px;padding:0 10px;border-radius:var(--radius-6);font-size:13px;color:var(--color-text-secondary)}
.ftabs button.on{background:var(--color-surface-card);color:var(--color-action-primary);font-weight:600}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--color-border-default);border-radius:var(--radius-14);padding:0 14px;height:52px;margin:var(--space-12) 0 var(--space-16);color:var(--color-text-secondary)}
.search input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--color-text-primary);min-width:0}
.bank{display:grid;grid-template-columns:1fr auto;gap:var(--space-12) var(--space-16);padding:var(--space-16) 0;border-bottom:1px solid var(--color-border-default)}
.bank.sel{background:linear-gradient(var(--color-surface-card),var(--color-surface-card)) padding-box;margin:0 calc(var(--space-12)*-1);padding-inline:var(--space-12);border-radius:var(--radius-12);border-bottom-color:transparent}
.bank-id{display:flex;align-items:center;gap:var(--space-12);min-width:0}
.bank-id b{font-size:15px;font-weight:600}
.bank-id small{display:block;font-size:12px;color:var(--color-text-secondary)}
.metrics{grid-column:1/2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-16)}
.metric span{display:block;font-size:12px;color:var(--color-text-secondary)}
.metric b{font-size:20px;font-weight:700}
.metric b.acc{color:var(--color-action-primary)}
.bank-act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:12px}
.empty{padding:48px 16px;text-align:center;color:var(--color-text-secondary)}
@media (max-width:720px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.bank{grid-template-columns:1fr}.bank-act{grid-row:auto;grid-column:auto;flex-direction:row-reverse;align-items:center}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:var(--space-16);font-size:12px;color:var(--color-text-secondary)}
.pages{display:flex;gap:6px}
.pages button{min-width:32px;height:32px;border-radius:var(--radius-6);border:1px solid var(--color-border-default);background:var(--color-surface-white);font-size:13px;color:var(--color-text-primary)}
.pages button.on{background:var(--color-surface-card);border-color:var(--color-border-blue);color:var(--color-action-primary);font-weight:600}
.pages button:disabled{color:var(--color-text-disabled)}

/* Bottom bar */
.bottom{position:sticky;bottom:0;z-index:20;margin-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.bottom .bar{transition:border-radius .2s,box-shadow .2s,padding .2s}
.bottom.stuck .bar{border-radius:var(--radius-20) var(--radius-20) 0 0;border-bottom-color:transparent;box-shadow:0 -6px 20px rgba(16,36,94,.08);padding-bottom:calc(var(--space-24) + env(safe-area-inset-bottom,0px))}
.bottom .bar{background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-24);display:flex;align-items:center;justify-content:space-between;gap:var(--space-16);flex-wrap:wrap}
.bottom .left{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--color-text-secondary)}
.bottom .btns{display:flex;gap:12px;flex-wrap:wrap}

/* Modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{width:520px;max-width:100%;background:var(--color-surface-white);border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20);box-shadow:var(--shadow-pop);max-height:calc(100vh - 32px);overflow:auto}
.modal-h{display:flex;gap:12px;align-items:flex-start}
.modal-h div{flex:1}
.modal-h p{margin:4px 0 0;font-size:13px;color:var(--color-text-secondary)}
.close{width:36px;height:36px;border-radius:999px;border:1px solid var(--color-border-blue);color:var(--color-action-primary);display:grid;place-items:center;flex:none}
.segtabs{display:inline-flex;padding:4px;gap:4px;border-radius:var(--radius-999);background:var(--color-surface-card);border:1px solid var(--color-border-blue);flex-wrap:wrap}
.segtabs button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--color-text-secondary)}
.segtabs button.on{background:var(--color-surface-white);color:var(--color-action-primary);font-weight:600}
.alert{display:flex;gap:12px;background:var(--color-surface-card);border-radius:var(--radius-20);padding:var(--space-20);color:var(--color-action-primary)}
.alert.warning{background:var(--color-warning-bg);color:var(--color-warning-text)}
.alert.warning b{color:var(--color-warning-text)}
.alert svg{flex:none;margin-top:1px}
.field.err{border-color:var(--color-error)}
.err-text{display:flex;gap:6px;align-items:flex-start;margin:6px 0 0;font-size:12px;line-height:18px;color:var(--color-error)}
.bottom .alert{margin-bottom:var(--space-12)}
.alert b{display:block;font-size:13px}
.alert span{font-size:12px;color:var(--color-text-secondary)}
.modal-act{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));background:var(--color-text-primary);color:var(--color-surface-white);padding:10px 16px;border-radius:var(--radius-12);font-size:13px;z-index:60;box-shadow:var(--shadow-pop)}
.subsidy-note{font-size:12px;color:var(--color-success)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- flow additions ---- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:var(--space-24);align-items:start;margin-top:var(--space-24)}
@media (max-width:980px){.layout{grid-template-columns:1fr}.layout .side{order:-1}}
.main-col,.side{display:flex;flex-direction:column;gap:var(--space-16);min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--space-16)}
.stack-24{display:flex;flex-direction:column;gap:var(--space-24)}
.card.pad32{padding:var(--space-32)}
@media (max-width:640px){.card.pad32{padding:var(--space-20)}}
.divider{height:1px;background:var(--color-border-default)}
h1.sec{font-size:24px;line-height:32px;font-weight:600;margin:0}
h3{font-size:17px;font-weight:600;margin:0}
.desc{color:var(--color-text-secondary);margin:0}
.grid{display:grid;gap:var(--space-16)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.helper{margin:6px 0 0;font-size:12px;line-height:18px;color:var(--color-text-secondary)}
.field.dis{background:var(--color-surface-page);color:var(--color-text-secondary)}
.field input::placeholder{color:var(--color-text-muted)}
.inset-white{border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}
.link{color:var(--color-action-primary);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.step-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.autosave{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-secondary)}
.autosave svg{color:var(--color-success)}
.borrower{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rating{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rating b{font-size:40px;line-height:44px;color:var(--color-success)}
.cb-row{display:flex;align-items:center;gap:10px;text-align:left}

/* sidebar */
.side-card{background:var(--color-surface-white);border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}
.side-card.blue{background:var(--color-surface-card)}
.side-card h4{margin:0;font-size:18px;line-height:26px;font-weight:600}
.avatars{display:flex}
.avatars .avatar{border:2px solid var(--color-surface-white);margin-left:-8px}
.avatars .avatar:first-child{margin-left:0}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-14);text-align:left;width:100%}
.step:hover{background:var(--color-surface-page)}
.step.cur{background:var(--color-surface-card);color:var(--color-action-primary);font-weight:600}
.step .n{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:12px;flex:none;background:var(--color-chart-track-soft);color:var(--color-text-secondary);font-weight:500}
.step.cur .n{background:var(--color-surface-white);border:1px solid var(--color-chart-track);color:var(--color-action-primary)}
.step.done .n{background:var(--color-action-primary);color:#fff}
.step .t{flex:1}
.icon-tile{width:40px;height:40px;border-radius:var(--radius-12);background:var(--color-surface-white);display:grid;place-items:center;color:var(--color-action-primary);flex:none}
.side-card.blue .icon-tile{background:var(--color-surface-white)}
.icon-tile.blue{background:var(--color-surface-card)}
.faq{font-size:13px;color:var(--color-text-secondary);padding:0 var(--space-24)}

/* upload */
.upz{display:flex;align-items:center;gap:12px;padding:16px 20px 16px 16px;border:1px dashed var(--color-chart-track);border-radius:var(--radius-16);background:var(--color-surface-card);text-align:left;width:100%;cursor:pointer}
.upz:hover{border-color:var(--color-action-primary)}
.upz.err{border-color:var(--color-error)}
.upz .tx{flex:1;min-width:0}
.upz b{display:block;font-size:14px}
.upz small{display:block;font-size:12px;color:var(--color-text-secondary)}
.upz .act{color:var(--color-action-primary);font-weight:600;font-size:13px;white-space:nowrap}
.file{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--color-border-default);border-radius:var(--radius-14);background:var(--color-surface-white);min-width:0}
.file .fmt{width:36px;height:36px;border-radius:var(--radius-10);background:var(--color-surface-card);color:var(--color-action-primary);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.file .tx{flex:1;min-width:0}
.file b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{font-size:12px;color:var(--color-text-secondary)}
.file .ok{color:var(--color-success)}
.file button{color:var(--color-text-secondary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* summary */
.sum{border:1px solid var(--color-border-default);border-radius:var(--radius-16);overflow:hidden}
.sum-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--color-border-default)}
.sum-row:first-child{border-top:0}
.sum-row .tick{width:24px;height:24px;border-radius:999px;background:var(--color-action-primary);color:#fff;display:grid;place-items:center;flex:none}
.sum-row .tick.no{background:var(--color-chart-track-soft);color:var(--color-text-secondary)}
.sum-row .tx{flex:1;min-width:0}
.sum-row b{display:block;font-size:14px}
.sum-row small{display:block;font-size:13px;color:var(--color-text-secondary)}

/* signing */
.participant{border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.p-head{display:flex;align-items:center;gap:12px}
.p-head .tx{flex:1}
.p-head small{display:block;color:var(--color-text-secondary);font-size:13px}
.num-step{display:flex;align-items:center;gap:12px}
.num-step .n{width:28px;height:28px;border-radius:999px;border:1px solid var(--color-chart-track);color:var(--color-action-primary);display:grid;place-items:center;font-size:12px;flex:none}
.num-step .tx{flex:1}
.num-step b{display:block;font-size:15px}
.num-step small{color:var(--color-text-secondary);font-size:13px}
.pad{position:relative;height:180px;border:1px dashed var(--color-chart-track);border-radius:var(--radius-16);background:var(--color-surface-white);overflow:hidden;touch-action:none}
.pad.err{border-color:var(--color-error)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--color-text-muted);font-size:13px;pointer-events:none}
.doc-box{background:var(--color-surface-card);border-radius:var(--radius-16);padding:var(--space-20);display:flex;flex-direction:column;gap:12px}
.doc-box p{margin:0;font-size:13px;color:var(--color-text-secondary)}
.row-btns{display:flex;gap:12px;flex-wrap:wrap}

/* status */
.metrics3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-16);margin-top:var(--space-24)}
@media (max-width:720px){.metrics3{grid-template-columns:1fr}}
.metric-card{background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:var(--space-20);display:flex;flex-direction:column;gap:4px}
.metric-card span{font-size:13px;color:var(--color-text-secondary)}
.metric-card b{font-size:32px;line-height:40px;font-weight:600}
.metric-card small{font-size:12px;color:var(--color-success)}
.cond{border:1px solid var(--color-border-default);border-radius:var(--radius-16);padding:var(--space-20);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-16)}
@media (max-width:720px){.cond{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cond span{display:block;font-size:12px;color:var(--color-text-secondary)}
.cond b{font-size:20px;font-weight:700}
.cond b.acc{color:var(--color-action-primary)}
.hero-blue{background:var(--color-surface-card);border-radius:var(--radius-16);padding:var(--space-32);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero-blue p{margin:0;max-width:480px;color:var(--color-text-secondary)}
.hero-blue.ok{background:var(--color-success-bg)}
.hero-blue.ok .icon-tile{color:var(--color-success)}
.bank-pick{display:flex;flex-direction:column;gap:12px;padding:var(--space-20);border:1px solid var(--color-border-default);border-radius:var(--radius-20);background:var(--color-surface-white);text-align:left;width:100%}
.bank-pick.on{background:var(--color-surface-card);border:2px solid var(--color-action-primary);padding:19px}
.bank-pick .hd{display:flex;align-items:center;gap:12px}
.bank-pick .hd b{flex:1;font-size:17px}
.bank-pick small{display:block;font-size:13px;color:var(--color-text-secondary)}
.mail{background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-16);padding:var(--space-20);display:flex;flex-direction:column;gap:16px}
.mail-body{background:var(--color-surface-white);border:1px solid var(--color-border-default);border-radius:var(--radius-12);padding:var(--space-20);display:flex;flex-direction:column;gap:12px;font-size:13px}
.mail-body p{margin:0}
.collapse{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--color-border-default);border-radius:var(--radius-16);padding:16px 20px;background:var(--color-surface-white)}
.collapse b{flex:1}

/* client page */
.client-head{background:var(--color-surface-white);border-bottom:1px solid var(--color-border-default)}
.client-head .wrap{height:72px;display:flex;align-items:center;gap:16px}
.client-wrap{max-width:824px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px;display:flex;flex-direction:column;gap:16px}
.c-hero{background:var(--color-surface-card);border-radius:var(--radius-20);padding:var(--space-32);display:flex;align-items:center;gap:var(--space-24)}
.c-hero .tx{flex:1;display:flex;flex-direction:column;gap:12px}
.c-hero h1{margin:0;font-size:26px;line-height:32px;font-weight:600;text-wrap:balance}
@media (max-width:640px){.c-hero{flex-direction:column;align-items:flex-start}.c-hero svg.ill{display:none}}
.progress{height:6px;border-radius:3px;background:var(--color-chart-track-soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--color-action-primary);transition:width .3s}
.secure{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary);text-align:center}

/* offer modal */
.modal.wide{width:800px}
.preview{border:1px solid var(--color-border-default);border-radius:var(--radius-20);overflow:hidden}
.preview .band{background:var(--color-action-primary);color:#fff;padding:var(--space-24);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.preview .band b{font-size:20px}
.preview .band small{opacity:.85;font-size:13px;text-align:right}
.preview .body{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}
.offer-bank{background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-16);padding:var(--space-20);display:flex;flex-direction:column;gap:12px}
.offer-bank .m{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.offer-bank span{display:block;font-size:12px;color:var(--color-text-secondary)}
.offer-bank b.v{font-size:20px;font-weight:700}

/* screens menu */
.screens a{display:block;padding:9px 12px;border-radius:var(--radius-10);color:var(--color-text-primary);text-decoration:none;font-size:14px}
.screens a:hover{background:var(--color-surface-page)}
.screens a.on{background:var(--color-surface-card);color:var(--color-action-primary);font-weight:500}
.screens small{display:block;padding:4px 12px 8px;color:var(--color-text-secondary);font-size:12px}

.step.locked{color:var(--color-text-disabled);cursor:default}
.step.locked:hover{background:none}
.step.locked .n{background:var(--color-surface-page);color:var(--color-text-disabled)}
.client-wrap{padding-bottom:24px}
/* Мягко / Input: floating label. Пусто → лейбл внутри как плейсхолдер (16px muted); фокус или значение → лейбл 12px сверху, плейсхолдер виден только в фокусе */
.field{min-height:64px;padding:10px 16px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--color-action-primary);box-shadow:inset 0 0 0 1px var(--color-action-primary)}
.field.err:focus-within{border-color:var(--color-error);box-shadow:inset 0 0 0 1px var(--color-error)}
.field .lab{transition:top .15s,font-size .15s,transform .15s}
.field:has(input:placeholder-shown):not(:focus-within) .lab{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);font-size:16px;line-height:22px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field:has(input:placeholder-shown):not(:focus-within) .suffix{opacity:0}
.field:not(:focus-within) input::placeholder{color:transparent}
.field input{padding-top:4px}
.field .suffix{right:16px;bottom:12px}
/* Блоки информации разделяются отступом, без линий */
.card.anketa{gap:40px}
/* Участники заявки */
.parts{display:flex;flex-direction:column;gap:16px}
.parts-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.parts-head h2{font-size:18px;line-height:26px;font-weight:600;margin:0}
.parts-list{display:flex;flex-wrap:wrap;gap:12px}
.part{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--color-border-default);border-radius:var(--radius-16);background:var(--color-surface-white);min-width:0;flex:1 1 240px}
.part.cur{background:var(--color-surface-card);border-color:var(--color-border-blue)}
.part .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.part .tx b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part .tx small{font-size:12px;color:var(--color-text-secondary)}
.part-x{display:inline-flex;color:var(--color-text-secondary);padding:4px;border-radius:var(--radius-10)}
.part-x:hover{background:var(--color-surface-page)}
.part{flex:0 1 auto}
.part.cur .avatar{background:var(--color-surface-white)}
/* Превью письма клиенту */
.mail-prev{border:1px solid var(--color-border-default);border-radius:var(--radius-20);overflow:hidden}
.mail-meta{padding:16px 20px;display:flex;flex-direction:column;gap:6px;background:var(--color-surface-white)}
.mail-meta .cap{font-size:12px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.mail-meta div{display:flex;gap:12px;font-size:13px;min-width:0}
.mail-meta div span{color:var(--color-text-secondary);width:44px;flex:none}
.mail-meta div b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-canvas{background:var(--color-surface-page);padding:24px 16px}
.letter{max-width:560px;margin:0 auto;background:var(--color-surface-white);border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:28px;display:flex;flex-direction:column;gap:20px}
.l-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.l-logo{font-weight:700;font-size:18px;color:var(--color-action-primary)}
.l-top small{font-size:12px;color:var(--color-text-secondary)}
.l-hero{background:var(--color-surface-card);border-radius:var(--radius-16);padding:24px;display:flex;align-items:center;gap:16px}
.l-hero .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.l-hero h3{font-size:22px;line-height:28px;font-weight:600;margin:0;text-wrap:balance}
.l-hero p{margin:0;font-size:14px;line-height:22px;color:var(--color-text-secondary)}
.l-art{width:168px;flex:none;height:auto}
.l-params{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.l-params span{display:block;font-size:12px;color:var(--color-text-secondary)}
.l-params b{font-size:15px;font-weight:600;white-space:nowrap}
.l-banks{display:flex;flex-direction:column;gap:8px}
.l-bank{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--color-border-default);border-radius:var(--radius-16)}
.l-bank .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.l-bank .nm b{font-size:15px;font-weight:600}
.l-bank small{font-size:12px;color:var(--color-text-secondary)}
.l-bank .rt{text-align:right;display:flex;flex-direction:column}
.l-bank .rt b{font-size:20px;font-weight:700;color:var(--color-action-primary)}
.l-cta{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.l-cta .btn{pointer-events:none;min-width:220px}
.l-cta small{font-size:12px;color:var(--color-text-muted)}
.l-broker{display:flex;align-items:center;gap:12px;padding-top:4px}
.l-broker b{display:block;font-size:14px;font-weight:600}
.l-broker small{font-size:12px;color:var(--color-text-secondary)}
.l-foot{margin:0;font-size:11px;line-height:16px;color:var(--color-text-muted)}
@media (max-width:640px){.l-hero{flex-direction:column-reverse;align-items:flex-start}.l-art{width:140px}.l-params{grid-template-columns:repeat(2,minmax(0,1fr))}.letter{padding:20px}}
/* Контакты менеджера в письме */
.l-manager{border:1px solid var(--color-border-default);border-radius:var(--radius-16);padding:20px;display:flex;flex-direction:column;gap:14px}
.l-manager .who{display:flex;align-items:center;gap:12px}
.l-manager .who b{display:block;font-size:15px;font-weight:600}
.l-manager .who small{display:block;font-size:12px;color:var(--color-text-secondary)}
.l-manager .contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px}
.l-manager .contacts div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.l-manager .contacts svg{color:var(--color-action-primary);flex:none}
.l-manager .contacts span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-manager p{margin:0;font-size:13px;color:var(--color-text-secondary)}
/* Модалка: контент прокручивается внутри, шапка и действия закреплены */
.modal>*{flex-shrink:0}
.modal{overscroll-behavior:contain}
.modal-h{position:sticky;top:calc(var(--space-24)*-1);z-index:3;background:var(--color-surface-white);margin:calc(var(--space-24)*-1) calc(var(--space-24)*-1) 0;padding:var(--space-24) var(--space-24) 12px}
.modal-act{position:sticky;bottom:calc(var(--space-24)*-1);z-index:3;background:var(--color-surface-white);margin:0 calc(var(--space-24)*-1) calc(var(--space-24)*-1);padding:16px var(--space-24) var(--space-24)}
.l-docs{display:flex;flex-direction:column;gap:12px}
.l-docs h4{margin:0;font-size:16px;line-height:24px;font-weight:600}
.l-docs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.l-docs li{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--color-surface-card);border-radius:var(--radius-16)}
.l-docs .ic{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:var(--radius-10);background:var(--color-surface-white);color:var(--color-action-primary);flex:none}
.l-docs li b{display:block;font-size:14px;font-weight:600}
.l-docs li small{display:block;font-size:12px;color:var(--color-text-secondary)}
.l-docs p{margin:0;font-size:13px;color:var(--color-text-secondary)}
.l-cta .btn{pointer-events:auto;text-decoration:none}
.l-cta small{text-align:center}
/* LineTabs: общая линия заканчивается на последнем табе */
.linetabs{width:max-content;max-width:calc(100% - 43px);overflow-x:auto}
/* SegmentedTabs: по ширине табов, не растягиваются на всю строку */
.segtabs{align-self:flex-start;width:max-content;max-width:100%}
.segtabs button:focus{outline:none}
.segtabs button:focus-visible{outline:2px solid var(--color-action-primary);outline-offset:2px}
/* ===== Hover-состояния всех интерактивных элементов ===== */
button,a,.field.select,.upz,.chip,.cb{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.icon-btn{border-radius:var(--radius-10);width:36px;height:36px}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--color-surface-card)}
.logo:hover{color:var(--color-action-hover)}
.link:hover{color:var(--color-action-hover);text-decoration:underline}
a.link{text-decoration:none}
.linetabs button:not(.on):hover{color:var(--color-action-primary);border-bottom-color:var(--color-border-blue)}
.chip:hover{border-color:var(--color-action-primary)}
.chip.active:hover{background:var(--color-surface-white)}
.ftabs button:not(.on):hover{background:var(--color-surface-page);color:var(--color-text-primary)}
.segtabs button:not(.on):hover{background:rgba(255,255,255,.6);color:var(--color-text-primary)}
.cb:hover,.cb-row:hover .cb{border-color:var(--color-action-primary)}
.cb.on:hover{background:var(--color-action-hover);border-color:var(--color-action-hover)}
.pages button:not(:disabled):not(.on):hover{border-color:var(--color-action-primary);color:var(--color-action-primary)}
.pages button:disabled{cursor:default}
.field.select:hover,.field:not(.dis):not(:focus-within):hover{border-color:var(--color-border-blue)}
.field.err:hover{border-color:var(--color-error)}
.switch{cursor:pointer}
.switch:hover .t{background:var(--color-border-blue)}
.switch.on:hover .t{background:var(--color-action-hover)}
.mail .row{border-radius:var(--radius-12)}
.mail .row:hover{background:var(--color-surface-page)}
.collapse:hover{border-color:var(--color-border-blue);background:var(--color-surface-page)}
.bank-pick:not(.on):hover{border-color:var(--color-border-blue);background:var(--color-surface-page)}
.bank-pick.on:hover{background:var(--color-surface-card)}
.bank{transition:background-color .15s}
/* Участники — сетка: карточки встают в ряд одинаковой ширины, лишние переносятся */
.parts-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.part{flex:none;min-width:0}
.part .badge{flex:none;white-space:nowrap}
.part .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.part .meta .badge{height:22px;font-size:12px}
.part.cur .badge{background:var(--color-surface-white)}
/* Фокус-обводка только с клавиатуры */
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--color-action-primary);outline-offset:2px}
/* ===== Ипотечные заявки ===== */
.card.deals{display:flex;flex-direction:column;gap:20px}
.card.deals h2{margin:0}
.card.deals .desc{margin:4px 0 0}
.deals-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.deals-bar .search{flex:1 1 320px;margin:0}
.btn.outline.on{background:var(--color-surface-card);border-color:var(--color-border-blue)}
.btn .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--color-action-primary);color:#fff;font-size:12px}
.unread-n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--color-surface-card);color:var(--color-action-primary);font-size:12px;font-weight:600;margin-left:6px}
.deals-filter{border:1px solid var(--color-border-default);border-radius:var(--radius-20);padding:24px;display:flex;flex-direction:column;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.table-wrap{overflow-x:auto;margin:0 -8px}
.deals-t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:960px}
.deals-t th{text-align:left;font-weight:400;font-size:13px;color:var(--color-text-secondary);padding:12px 12px;border-bottom:1px solid var(--color-border-default);white-space:nowrap}
.deals-t td{padding:16px 12px;border-bottom:1px solid var(--color-border-default);vertical-align:top;line-height:22px}
.deals-t tr:last-child td{border-bottom:0}
.deals-t td small{display:block;font-size:12px;line-height:18px;color:var(--color-text-secondary)}
.deals-t td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.deals-t td.num b{font-weight:600}
.deals-t tbody tr{cursor:pointer;transition:background-color .15s}
.deals-t tbody tr:hover td{background:var(--color-surface-page)}

.deals-t tbody tr.unread:hover td{background:#e4effd}
.deals-t tbody tr.arch td{color:var(--color-text-secondary);background:#f6f7f9}
.deals-t tbody tr.arch:hover td{background:#eff1f4}
.deals-t tbody tr.arch .deal-name b,.deals-t tbody tr.arch td.num b{color:var(--color-text-secondary);font-weight:500}
.deals-t tbody tr.arch .deal-name svg{color:var(--color-text-secondary)}
.deals-t tbody tr.arch .badge{background:var(--color-surface-white)}
.arch-tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;margin:4px 0 2px;border-radius:999px;border:1px solid var(--color-border-default);background:var(--color-surface-white);font-size:12px;line-height:18px;color:var(--color-text-secondary)}
.deals-t tbody tr.arch-head td{padding:20px 12px 8px;font-size:13px;font-weight:600;color:var(--color-text-secondary);cursor:default;background:none}
.deals-t tbody tr.arch-head td svg{vertical-align:-3px;margin-right:4px}
.deals-t tbody tr.arch-head:hover td{background:none}
.icon-btn.restore{color:var(--color-action-primary);background:var(--color-surface-card)}
.icon-btn.restore:hover{background:var(--color-surface-hover-soft)}
.deals-t td:first-child{border-radius:0}
.deal-name{display:inline-flex;align-items:center;gap:6px;color:var(--color-action-primary);text-align:left}

function useOutside(ref,cb,active){

function RangeField({id,label,value,onCommit,min,max,step=1,unit='money',suffix='₽',aside,map,error,below}){
  const [d,setD]=useState(value); useEffect(()=>setD(value),[value]);
  useEffect(()=>{if(d===value)return;const t=setTimeout(()=>onCommit(d),450);return()=>clearTimeout(t)},[d]);
  const rv=map?map.to(d):d, p=Math.max(0,Math.min(100,(rv-min)/(max-min)*100));
  const shown=unit==='money'?Math.round(d).toLocaleString('ru-RU'):String(d);
  return html`<div><label class=${'field sm rf'+(error?' err':'')} for=${id}><span class="lab">${label}</span>
    <input id=${id} value=${shown} inputmode="numeric" onInput=${e=>setD(+digits(e.target.value)||0)} onBlur=${()=>{if(d!==value)onCommit(d)}} onKeyDown=${e=>{if(e.key==='Enter')e.target.blur()}}/>
    <span class="suffix">${typeof suffix==='function'?suffix(d):suffix}${aside!=null&&html`<b class="rf-aside">${typeof aside==='function'?aside(d):aside}</b>`}</span>

    ${below&&below(d,v=>{setD(v);onCommit(v)})}<${FieldError} text=${error}/></div>`;
}

  const [open,setOpen]=useState(false); const ref=useRef(); useOutside(ref,()=>setOpen(false),open);

  return html`<div class="anchor" ref=${ref}>
    <button class=${'field select ms'+(error?' err':'')} onClick=${()=>setOpen(!open)} aria-expanded=${open} aria-haspopup="listbox"><span class="lab">${label}</span>
      <span class=${'val'+(value.length?'':' ph')}>${shown}${value.length>1&&html`<b class="ms-more">+${value.length-1}</b>`}</span>${ic.chev(18)}</button>
    ${error?html`<${FieldError} text=${error}/>`:helper&&html`<p class="helper">${helper}</p>`}
    ${open&&html`<div class="pop ms-pop" style=${{width:'100%',minWidth:'0'}}><div class="menu" role="listbox" aria-multiselectable="true">${options.map(o=>{const on=value.includes(o.value);

      ${note&&html`<p class="ms-note">${ic.info(14)}<span>${note}</span></p>`}</div>`}
  </div>`;
}

/* Футер: без скролла стоит в 24px от низа; пока под ним есть контент — прибит к краю, без нижних скруглений, с тенью */
function useStuck(){
  const [s,setS]=React.useState(false);
  React.useEffect(()=>{const upd=()=>{const el=document.scrollingElement||document.documentElement;setS(el.scrollHeight-el.clientHeight-el.scrollTop>12)};
    upd();addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);const ro=new ResizeObserver(upd);ro.observe(document.body);
    return()=>{removeEventListener('scroll',upd);removeEventListener('resize',upd);ro.disconnect()}},[]);
  return s;
}
function BottomBar({left,secondary,primary,onSecondary,onPrimary,alert,narrow}){
  const stuck=useStuck();
  return html`<div class=${'bottom'+(stuck?' stuck':'')}><div class="wrap" style=${narrow?{maxWidth:'824px'}:null}>${alert}
    <div class="bar"><div class="left">${left}</div>
      <div class="btns">${secondary&&html`<button class="btn outline" onClick=${onSecondary}>${secondary}</button>`}<button class="btn primary" onClick=${onPrimary}>${primary}</button></div></div></div></div>`;
}

function BankTerm({name,approved}){
  const {calc,f,termBy,setTermBy,say}=useApp(); const t=calc.termOf(name); const changed=termBy[name]&&termBy[name]!==f.term;
  const set=v=>{v=Math.max(1,Math.min(30,v));setTermBy(o=>({...o,[name]:v}));say(`Срок в ${name} — ${years(v)}. Отправим банку уточнение`)};
  return html`<div class="term-edit">
    <div class="tx"><b>Срок кредита в этом банке</b><small>${changed?'Изменён · в подборе было '+years(f.term):approved?'После одобрения банк пересчитает платёж':'Можно поменять до решения банка'}</small></div>
    <div class="row" style=${{gap:'12px',flexWrap:'nowrap'}}>
      ${changed&&html`<button class="link s" style=${{margin:0}} onClick=${()=>{setTermBy(x=>{const n={...x};delete n[name];return n});say('Срок в '+name+' — как в подборе')}}>Вернуть</button>`}
      <div class="mini-stp"><button aria-label="Уменьшить срок" disabled=${t<=1} onClick=${()=>set(t-1)}>${ic.minus(16)}</button><b class="num">${t}</b>
        <button aria-label="Увеличить срок" disabled=${t>=30} onClick=${()=>set(t+1)}>${ic.plus(16)}</button></div><span class="desc" style=${{fontSize:'13px'}}>${plural(t,'год','года','лет')}</span></div>
  </div>`;
}

/* Боковая карточка на шаге подбора: что выбрано и на какую сумму */
/* Выбранный банк: раскрывается, внутри — свой срок и первый взнос для этого банка. Отправленный банк не редактируется */
function PkRow({o,onRemove}){
  const {calc,f,sent,termBy,setTermBy,downBy,setDownBy,say}=useApp();
  const [open,setOpen]=useState(false); const [dErr,setDErr]=useState('');
  const sx=sent.find(q=>q.name===o.name); const custom=calc.custom(o.name);
  const lim=bankLimits(BANKS.findIndex(b=>b[0]===o.name),f.program);
  const t=calc.termOf(o.name), d=calc.downOf(o.name), dp=f.price?d/f.price*100:0;
  const [dDraft,setDDraft]=useState(d); useEffect(()=>setDDraft(d),[d]);
  const setT=v=>{v=Math.max(1,Math.min(lim.term,v));setTermBy(x=>{const n={...x};if(v===f.term)delete n[o.name];else n[o.name]=v;return n})};
  const commitD=v=>{const p=f.price?v/f.price*100:0;
    if(p<lim.down){setDErr(`В ${o.name} взнос от ${String(lim.down).replace('.',',')}% — от ${rub(Math.ceil(f.price*lim.down/100))}`);return}
    if(v>=f.price){setDErr('Взнос должен быть меньше стоимости');return}
    setDErr('');setDownBy(x=>{const n={...x};if(v===f.down)delete n[o.name];else n[o.name]=v;return n})};
  const reset=()=>{setTermBy(x=>{const n={...x};delete n[o.name];return n});setDownBy(x=>{const n={...x};delete n[o.name];return n});setDErr('');say(`${o.name} — условия как в подборе`)};
  const pay=calc.payOf(o);
  const line=sx?(sx.status==='approved'?'Одобрено':'Отправлено')+' '+fmtAt(sx.at):pct(o.rate)+' · '+rub(pay)+' в месяц';
  return html`<div class=${'pk-wrap'+(open?' open':'')}>
    <div class="pk"><button class="pk-h" disabled=${!!sx} aria-expanded=${open} onClick=${()=>setOpen(!open)} title=${sx?'Анкета уже отправлена — условия не меняются':'Изменить срок и взнос для этого банка'}>
        <span class="avatar">${o.ini}</span><span class="tx"><b>${o.name}</b><small class="num">${line}</small>
        ${custom&&!open&&html`<small class="pk-custom">Свои условия: ${years(t)} · взнос ${pctStr(dp)}</small>`}</span>
        ${!sx&&html`<span class=${'cp-chev'+(open?' up':'')}>${ic.chev(16)}</span>`}</button>
      ${sx?html`<span class="pk-lock" title="Анкета уже отправлена в банк — убрать нельзя" aria-label="Анкета отправлена, убрать нельзя">${ic.lock(16)}</span>`:onRemove&&html`<button class="part-x" aria-label=${'Убрать '+o.name} onClick=${()=>onRemove(o.name)}>${ic.x(16)}</button>`}</div>
    ${open&&html`<div class="pk-edit">
      <div class="pk-f"><span class="pk-l">Срок кредита<small>в банке до ${years(lim.term)}</small></span>
        <div class="mini-stp"><button aria-label="Уменьшить срок" disabled=${t<=1} onClick=${()=>setT(t-1)}>${ic.minus(16)}</button><b class="num">${t}</b>
          <button aria-label="Увеличить срок" disabled=${t>=lim.term} onClick=${()=>setT(t+1)}>${ic.plus(16)}</button></div></div>
      <div class="pk-f col"><label class="pk-l" for=${'pk-d-'+o.ini}>Первый взнос<small>в банке от ${String(lim.down).replace('.',',')}%</small></label>
        <div class=${'pk-money'+(dErr?' err':'')}><input id=${'pk-d-'+o.ini} inputmode="numeric" value=${Math.round(dDraft).toLocaleString('ru-RU')}
          onInput=${e=>setDDraft(+digits(e.target.value)||0)} onBlur=${()=>commitD(dDraft)} onKeyDown=${e=>{if(e.key==='Enter')e.target.blur()}}/><span>₽</span><b>${pctStr(f.price?dDraft/f.price*100:0)}</b></div>
        ${dErr&&html`<span class="err-text pk-err">${ic.alert(14)}${dErr}</span>`}</div>
      <div class="pk-res num"><span>Кредит ${rub(calc.loanOf(o.name))}</span><span>Платёж ${rub(pay)} в месяц</span></div>
      ${custom?html`<button class="link s pk-reset" onClick=${reset}>Вернуть как в подборе</button>`:html`<span class="pk-hint">Изменения касаются только ${o.name}</span>`}
    </div>`}
  </div>`;
}

const toFirstErr=()=>setTimeout(()=>{const root=document.querySelector('.overlay .modal')||document.querySelector('main')||document;
  const el=root.querySelector('.field.err,.upz.err,.err-text');if(!el)return;

function useValidation(){
  const [errs,setErrs]=useState({}); const [tried,setTried]=useState(false);
  const run=(rules)=>{const e={};for(const [k,msg] of Object.entries(rules)) if(msg) e[k]=msg; setErrs(e); setTried(true); if(Object.keys(e).length)toFirstErr(); return !Object.keys(e).length};
  return {errs,tried,run,setErrs,clear:k=>setErrs(o=>{const n={...o};delete n[k];return n})};
}

const pplOf=ps=>ps?ps.people:[];
/* Форма прескоринга по API подрядчика: скан паспорта (PDF/JPG до 10 МБ) распознаётся в те же пять полей, их можно ввести и вручную */
const PS_EMPTY={last:'',first:'',middle:'',series:'',number:'',docs:[],recog:'idle',auto:{}};
const PS_FIELDS=[['last','Фамилия','фамилию'],['first','Имя','имя'],['middle','Отчество','отчество']];
const psFromPassport=(src=PASSPORT_DATA)=>{const [last,first,middle]=src.fio.split(' ');const [ser,num]=src.passNum.split(' ');return {last,first,middle,series:MASKS.passSer(ser),number:num}};
function psCheck(v){const e={};
  for(const [k,,acc] of PS_FIELDS){const t=v[k].trim();if(!t)e[k]='Укажите '+acc;else if(!/^[А-Яа-яЁё]+(-[А-Яа-яЁё]+)?$/.test(t))e[k]='Только русские буквы, как в паспорте'}

  if(digits(v.number).length!==6)e.number='Номер — 6 цифр';

function PsForm({v,setV,errs,setErrs,idp='',title,onRemove,src}){
  const set=(k,val)=>{setV(o=>({...o,[k]:val,auto:{...o.auto,[k]:false}}));setErrs(o=>({...o,[k]:''}))};
  const onFiles=fs=>{const f=fs[0];if(!f)return;
    if(!/\.(pdf|jpe?g)$/i.test(f.name)){setErrs(o=>({...o,docs:'Нужен файл PDF или JPG'}));return}
    if(f.size>10*1048576){setErrs(o=>({...o,docs:'Файл больше 10 МБ — сожмите его или отсканируйте заново'}));return}
    setErrs(o=>({...o,docs:''}));setV(o=>({...o,docs:[fileObj(f)],recog:'busy'}));
    /* демо: очень маленький файл считаем нечитаемым сканом */
    setTimeout(()=>{if(f.size<20*1024){setV(o=>({...o,recog:'fail'}));return}
      const d=psFromPassport(src);setV(o=>({...o,...d,recog:'done',auto:{last:true,first:true,middle:true,series:true,number:true}}));
      setErrs({})},1200)};
  return html`<div class=${'stack'+(title?' ps-person':'')}>
    ${title&&html`<div class="ps-person-h"><h3>${title}</h3>${onRemove&&html`<button class="part-x" aria-label="Убрать участника" onClick=${onRemove}>${ic.x(16)}</button>`}</div>`}

      ${v.docs.map(f=>html`<${FileItem} f=${f} onRemove=${()=>setV(o=>({...o,docs:[],recog:'idle',auto:{}}))}/>`)}
      ${v.recog==='busy'&&html`<div class="ps-recog"><span class="spinner sm"></span>Распознаём паспорт — подставим данные в поля ниже</div>`}
      ${v.recog==='fail'&&html`<${Alert} type="warning" title="Не удалось распознать паспорт">Заполните поля вручную или загрузите более чёткий скан<//>`}
    </div>
    <p class="hint" style=${{margin:0}}>${v.recog==='done'?'Данные подставлены из скана — сверьте их с паспортом':'Загрузите скан или заполните поля вручную — все поля обязательны'}</p>
    <div class="ps-grid">
      ${PS_FIELDS.map(([k,l])=>html`<${Field} id=${'ps-'+k+idp} label=${l} mask="name" value=${v[k]} onChange=${x=>set(k,x)} error=${errs[k]}/>`)}
      <${Field} id=${'ps-series'+idp} label="Серия" mask="passSer" inputMode="numeric" value=${v.series} onChange=${x=>set('series',x)} error=${errs.series} helper="4 цифры"/>
      <${Field} id=${'ps-number'+idp} label="Номер" mask="passNo" inputMode="numeric" value=${v.number} onChange=${x=>set('number',x)} error=${errs.number} helper="6 цифр"/>
    </div>
  </div>`;
}
function PsResult({p,i}){

async function makePrescorePdf(r,dealId){
  await ensurePdfLibs();
  const host=document.createElement('div');host.className='pdf-host';host.innerHTML=psReportHtml(r,dealId);document.body.appendChild(host);
  try{
    /* каждый блок рендерим отдельно, чтобы разрыв страницы не резал участника пополам */
    const blocks=[...host.firstElementChild.children];
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4'});
    const W=210,H=297,M=14,CW=W-2*M; let y=M;
    for(const el of blocks){
      const c=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
      const h=c.height*CW/c.width;
      if(y+h>H-M&&y>M){pdf.addPage();y=M}
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M,y,CW,h);y+=h+4;
    }
    return pdf.output('blob');
  } finally{host.remove()}
}
async function savePdf(blob,filename){
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(dl){await dl.save({filename,data:blob});return 'saved'}
  /* вне claude.ai (офлайн-файл) — обычное скачивание */
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return 'saved';
}

function Personal(){

function SignaturePad({onDraw,clearKey,error}){
  const ref=useRef(); const drawing=useRef(false); const [has,setHas]=useState(false);
  useEffect(()=>{const c=ref.current;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#0c2ad0';setHas(false);onDraw(false)},[clearKey]);
  const pos=e=>{const r=ref.current.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const down=e=>{drawing.current=true;ref.current.setPointerCapture(e.pointerId);const x=ref.current.getContext('2d');x.beginPath();x.moveTo(...pos(e))};
  const move=e=>{if(!drawing.current)return;const x=ref.current.getContext('2d');x.lineTo(...pos(e));x.stroke();if(!has){setHas(true);onDraw(true)}};
  return html`<div class=${'pad'+(error?' err':'')}><canvas ref=${ref} onPointerDown=${down} onPointerMove=${move} onPointerUp=${()=>drawing.current=false} aria-label="Поле для подписи"></canvas>
    ${!has&&html`<div class="ph">${ic.pen(22)}Нарисуйте подпись мышью или пальцем</div>`}</div>`;
}

  /* guard: шаги идут строго по порядку */
  let target=route;
  if(order.includes(route)){ if(!selected.size&&route!=='podbor') target='podbor'; else { const gd=isMain?done:{...done,personal:!!ent(who).done.personal,family:true,income:!!ent(who).done.income}; const first=order.find(k=>!gd[k]&&!(k==='signing'&&!isMain)); const fi=first?order.indexOf(first):order.length; if(order.indexOf(route)>fi) target=first; } }
  if(route==='status'&&!sent.length) target=done[STEPS[STEPS.length-2][0]]?'signing':'podbor';
  useEffect(()=>{if(target!==route){go(target);setToast(target==='podbor'?'Сначала выберите банки на шаге «Подбор условий»':'Шаги анкеты заполняются по порядку')}},[target,route]);
  value.devJump=devJump;
  useEffect(()=>{if(!['personal','income'].includes(target)&&who!=='main')setWho('main')},[target]);
  const Page={'':Deals,podbor:Podbor,personal:Personal,family:Family,income:Income,signing:Signing,status:Status,client:Client}[target];
  return html`<${Ctx.Provider} value=${value}><${Page} key=${target}/>${chatOpen&&html`<${ChatModal}/>`}<${Toast}/><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);

</script>
